<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Escape Room - Quizzter</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="icon" href="assets/media/img/ChatGPT Image 26 may 2026, 02_40_00 p.m.png" /> 
  </head>

  <body class="fondo-quizzter">
    <header>
      <nav>
        <a href="index.html">
          <img src="assets/media/img/logo.PNG" id="logoPagina" />
        </a>

        <a href="quizzter.html" id="navLink"> Quizzter </a>

        <a href="desafios.html" id="navLink"> Daily Challenges </a>
        <a href="code-reminder.html" id="navLink"> Code Reminder </a>
        <button
          id="btn-cerrarSesion"
          type="button"
          class="btn btn-danger fw-medium"
        >
          Cerrar Sesión
        </button>
      </nav>
    </header>

    <main class="escape-container">
      <section class="escape-card">
        <div class="escape-header">
          <div>
            <span class="escape-label"> DAILY CHALLENGE </span>

            <h1>Escape Room</h1>
          </div>

          <div class="escape-nivel">
            Sala

            <strong id="numeroSala"> 1 </strong>

            / 5
          </div>
        </div>

        <div class="barra-escape">
          <div id="progresoEscape"></div>
        </div>

        <div class="escape-escena">
          <span id="personaje"> 🧍 </span>

          <span id="puerta"> 🔒 </span>
        </div>

        <div class="escape-desafio">
          <span id="dificultadEscape" class="dificultad-escape"> FÁCIL </span>

          <h2 id="preguntaEscape">Pregunta</h2>

          <div id="contenedorSugerenciasEscape" class="sugerencias-escape">
            <p>Posibles respuestas:</p>

            <div id="sugerenciasEscape"></div>
          </div>

          <input
            type="text"
            id="respuestaEscape"
            placeholder="Escribí tu respuesta..."
            autocomplete="off"
          />

          <button id="btnComprobarEscape">Comprobar respuesta</button>

          <p id="mensajeEscape"></p>

          <button id="btnSiguienteEscape" class="oculto">
            Siguiente sala →
          </button>
        </div>
      </section>
    </main>

    <script src="assets/js/api.js"></script>
    <script src="assets/js/escape-room.js"></script>
  </body>
</html>
