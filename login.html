<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Quizzter | Iniciar sesión</title>
        <link rel="icon" href="./assets/media/img/ChatGPT Image 26 may 2026, 02_40_00 p.m.png">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="./assets/css/login-style.css">
        <script src="https://accounts.google.com/gsi/client" async defer></script>
    </head>
    <body>
        <header>
            <nav>
                <img src="./assets/media/img/logo.PNG" alt="nombre de marca">
            </nav>
        </header>
        <main>
            <form class="container mt-5" style="max-width: 400px;">
                <h2 class="mb-4">Iniciar Sesión</h2>
                <div class="mb-3">
                    <label for="username" class="form-label">Nombre de usuario</label>
                    <input type="text" class="form-control" id="username" name="username" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="password" name="password" required>
                </div>
                <div id="loginError" class="alert alert-danger py-2 text-center d-none" role="alert">
                    Usuario o contraseña incorrectos.
                </div>
                <button type="submit" class="btn w-100">Ingresar</button>
            </form>
            <p class="text-secondary mt-3 text-center">- ó podrias tambien -</p>
            <div id="g_id_onload"
                data-client_id="631986817588-gj6ooav587rd6ob65moh206cf6fhrptl.apps.googleusercontent.com"
                data-context="signin"
                data-ux_mode="popup"
                data-callback="manejarLoginGoogle"
                data-auto_prompt="false">
            </div>
                <div class="g_id_signin" data-type="standard" data-shape="rectangular" data-theme="outline" data-text="signin_with" data-size="large" data-logo_alignment="left">
            </div>
            <h5><a href="./contraseña.html">Olvide mi contraseña</a></h5>
            <h5><a href="./registro.html">¿No tienes una cuenta? Registrate</a></h5>
        </main>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <script src="./assets/js/db.js"></script>
        <script src="./assets/js/login.js"></script>
    </body>
</html>
