<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Lección - Code Reminder</title>
  <link
      rel="icon"
      href="assets/img/ChatGPT Image 26 may 2026, 02_40_00 p.m.png"
    />
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="assets/css/style.css"
  >
</head>

<body class="fondo-quizzter">

  <header>
    <nav>
      <a href="index.html">
        <img
          src="assets/img/logo.PNG"
          id="logoPagina"
          alt="Quizzter"
        >
      </a>

      <a href="quizzter.html" id="navLink">
        Quizzter
      </a>

      <a href="code.reminder.html" id="navLink">
        Code Reminder
      </a>
    </nav>
  </header>

  <main class="leccion-container">

    <section class="leccion-card">

      <div class="leccion-superior">

        <a
          href="code.reminder.html"
          class="volver-code"
        >
          ← Volver a los módulos
        </a>

        <span id="numeroLeccion">
          Lección 1 de 5
        </span>

      </div>

      <div class="barra-leccion">
        <div id="progresoLeccion"></div>
      </div>

      <span
        class="leccion-categoria"
        id="categoriaLeccion"
      >
        FUNDAMENTOS
      </span>

      <h1 id="tituloLeccion"></h1>

      <div class="leccion-bloque">
        <h2>¿Para qué sirve?</h2>
        <p id="descripcionLeccion"></p>
      </div>

      <div class="leccion-bloque">
        <h2>Sintaxis</h2>
        <pre><code id="sintaxisLeccion"></code></pre>
      </div>

      <div class="leccion-bloque">
        <h2>Parámetros</h2>
        <p id="parametrosLeccion"></p>
      </div>

      <div class="leccion-bloque">
        <h2>Ejemplo</h2>
        <pre><code id="ejemploLeccion"></code></pre>
        <p id="explicacionEjemplo"></p>
      </div>

      <section class="practica-code">

        <span class="practica-label">
          🧠 AHORA PRACTICÁ
        </span>

        <h2 id="preguntaPractica"></h2>

        <pre class="codigo-ejercicio"><code id="codigoPractica"></code></pre>

        <input
          type="text"
          id="respuestaPractica"
          placeholder="Escribí tu respuesta..."
          autocomplete="off"
          spellcheck="false"
        >

        <button id="btnComprobarPractica">
          Comprobar
        </button>

        <div id="resultadoPractica"></div>

        <button
          id="btnSiguienteLeccion"
          class="oculto"
        >
          Siguiente lección →
        </button>

      </section>

    </section>

  </main>

  <script src="assets/js/code.leccion.js"></script>

</body>
</html>
