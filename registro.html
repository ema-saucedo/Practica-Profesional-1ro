<!DOCTYPE html>
    <html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Quizzter | Registrar una cuenta</title>
        <link rel="icon" href="./assets/media/img/ChatGPT Image 26 may 2026, 02_40_00 p.m.png">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="./assets/css/login-style.css">
    </head>
    <body>
        <header>
            <nav>
                <img src="./assets/media/img/logo.PNG" alt="nombre de marca">
            </nav>
        </header>
        <main>
            <form class="container mt-5" id="registroForm" style="max-width: 400px;">
                <h2 class="mb-4">Registrarse</h2>
                <div class="mb-3">
                    <label for="Nombre" class="form-label">Nombre completo</label>
                    <input type="text" class="form-control" id="Nombre" name="Nombre" required>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Correo electrónico</label>
                    <input type="email" class="form-control" id="email" name="email" required placeholder="@gmail.com">
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="password" name="password" required placeholder="Minimo: 8 caracteres" minlegth="8">
                </div>
                <ul class="list-unstyled small mt-2">
                    <li id="reqLargo" class="text-danger">❌ Mínimo 8 caracteres</li>
                    <li id="reqMayus" class="text-danger">❌ Al menos una mayúscula</li>
                    <li id="reqMinus" class="text-danger">❌ Al menos una minúscula</li>
                    <li id="reqNumero" class="text-danger">❌ Al menos un número</li>
                </ul>
                <div class="text-center">
                    <button type="button" class="btn btn-primary p-2" id="btnAbrirModal">Registrar</button>
                </div>
                <div class="modal fade" id="exampleModal" tabindex="-1" aria-hidden="true">
                    <div class="modal-dialog">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title">Este es el ultimo paso!</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                            </div>
                            <div class="modal-body">
                                <div>
                                    <label for="nombredeusuario">Nombre de usuario</label>
                                    <input type="text" class="form-control" id="nombredeusuario" name="nombredeusuario" required>
                                    <small id="feedbackUsuario"></small>
                                    <br>
                                    <br>
                                    <div class="dropdown">
                                        <button class="btn btn-secondary dropdown-toggle" type="button" id="dropdownMenu2" data-bs-toggle="dropdown" aria-expanded="false">
                                            Carrera que cursas
                                        </button>
                                        <div class="dropdown-menu" aria-labelledby="dropdownMenu2">
                                            <button class="dropdown-item" type="button">Desarrollo de software multiplataforma</button>
                                            <button class="dropdown-item" type="button">Mecatronica</button>
                                            <button class="dropdown-item" type="button">Quimica industrial</button>
                                            <button class="dropdown-item" type="button">Telecomunicaciones</button>
                                        </div>
                                    </div>
                                    <p class="text-muted">Si eres docente, este campo es irrelevante.</p>
                                    <br>
                                    <br>
                                    <div class="dropdown">
                                        <button class="btn btn-secondary dropdown-toggle" type="button" id="dropdownMenu" data-bs-toggle="dropdown" aria-haspopup="true" aria-expanded="false">Ocupación</button>
                                        <div class="dropdown-menu" aria-labelledby="dropdownMenu">
                                            <button class="dropdown-item" type="button">Docente</button>
                                            <button class="dropdown-item" type="button">Estudiante</button>
                                        </div>
                                    </div>
                                    <br>
                                    <br>
                                </div>
                            </div>
                             <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" id="btnFinalizarRegistro">Finalizar registro</button>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
            <div class="invalid-feedback" id="passFeedback">
                La contraseña no cumple con los requisitos de seguridad.
            </div>
            <h5><a href="./login.html">¿Ya tienes una cuenta? Inicia sesión</a></h5>
        </main>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <script src="./assets/js/db.js"></script>
        <script src="./assets/js/script.js"></script>
    </body>
</html>
