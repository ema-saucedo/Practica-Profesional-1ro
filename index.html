<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quizzter</title>
    <link
      rel="icon"
      href="assets/img/ChatGPT Image 26 may 2026, 02_40_00 p.m.png"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="assets/css/style.css" />
    <style>
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px); 
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        body {
            animation: fadeIn 1s ease-out forwards;
        }
    </style>
  </head>
  <!-- Cuerpo de la página  -->
  <body class="fondo-quizzter">
    <header>
      <!-- Navbar -->
      <nav>
        <a href="index.html"><img src="assets/img/logo.PNG" id="logoPagina" /></a>
        <a href="quizzter.html" id="navLink">Quizzter</a>
        <a href="code.reminder.html" id="navLink">Code reminder</a>
        <button id="btn-cerrarSesion" type="button" class="btn btn-danger fw-medium">Cerrar Sesión</button>
      </nav>
    </header>
    <!-- Carrousel de Bootstraps-->
    <section class="container mt-5">
      <div id="carouselExampleIndicators" class="carousel slide">
        <div class="carousel-indicators">
          <button
            type="button"
            data-bs-target="#carouselExampleIndicators"
            data-bs-slide-to="0"
            class="active"
            aria-current="true"
            aria-label="Slide 1"
          ></button>
          <button
            type="button"
            data-bs-target="#carouselExampleIndicators"
            data-bs-slide-to="1"
            aria-label="Slide 2"
          ></button>
          <button
            type="button"
            data-bs-target="#carouselExampleIndicators"
            data-bs-slide-to="2"
            aria-label="Slide 3"
          ></button>
        </div>
        <div class="carousel-inner">
          <div class="carousel-item active">
            <img src="assets/img/Imagen 1.png" class="d-block w-100" />
          </div>
          <div class="carousel-item">
            <img src="assets/img/Imagen 2.png" class="d-block w-100" />
          </div>
          <div class="carousel-item">
            <img src="assets/img/Imagen 3.png" class="d-block w-100" />
          </div>
        </div>
        <button
          class="carousel-control-prev"
          type="button"
          data-bs-target="#carouselExampleIndicators"
          data-bs-slide="prev"
        >
          <span class="carousel-control-prev-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Previous</span>
        </button>
        <button
          class="carousel-control-next"
          type="button"
          data-bs-target="#carouselExampleIndicators"
          data-bs-slide="next"
        >
          <span class="carousel-control-next-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Next</span>
        </button>
      </div>
    </section>

    <!-- Footer -->
    <div id="footerCont">
      <footer>
        <div>
          <p>&copy; 2026 Quizzter. Todos los derechos reservados.</p>
          <div>
            <a href="#">Términos de Servicio</a>
            <a href="#">Política de Privacidad</a>
            <a href="#">Soporte</a>
          </div>
        </div>
      </footer>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
     <script src="assets/js/db.js"></script>
     <script src="assets/js/index.js"></script>
  </body>
</html>
